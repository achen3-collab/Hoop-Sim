name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish CSV player stats
        run: |
          shopt -s nullglob
          for season in 2024-25 2025-26 2026-27; do
            csv_files=(data/csv/"${season}"*.csv)
            if [ "${#csv_files[@]}" -gt 1 ]; then
              echo "Expected at most one CSV for ${season}; found ${#csv_files[@]}." >&2
              exit 1
            fi
            if [ "${#csv_files[@]}" -eq 1 ]; then
              python scripts/publish_csv_stats.py "${csv_files[0]}" --season "$season"
            fi
          done

      - name: Calculate estimated PER
        run: python scripts/calculate_estimated_per.py

      - name: Sort pools by Yahoo ADP
        run: python scripts/apply_yahoo_adp.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html app.js styles.css _site/
          cp data/*.json _site/data/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
